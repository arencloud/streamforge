apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamforge-production
  namespace: argocd
  # No cascade finalizer: deletion of this Application must not delete Kafka data.
spec:
  project: streamforge
  sources:
    - repoURL: https://github.com/example/streamforge.git
      targetRevision: REPLACE_WITH_RELEASE_COMMIT
      path: charts/streamforge
      helm:
        releaseName: streamforge
        valueFiles:
          - $values/environments/production/values.yaml
          - ../../environments/example/all.yaml
    - repoURL: https://git.example.invalid/platform/streamforge-environments.git
      targetRevision: REPLACE_WITH_ENVIRONMENT_COMMIT
      ref: values
  destination:
    server: https://api.cluster.example.invalid:6443
    namespace: streamforge
  syncPolicy:
    # Creation is manual; after review enable automated.selfHeal. Never automate data deletion.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - FailOnSharedResource=true
    # Namespace labels and mesh enrollment are managed by the chart's Namespace.
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
