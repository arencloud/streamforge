quarkus.application.name=streamforge-camel-s3
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=45s
quarkus.log.level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."software.amazon.awssdk".level=WARN
camel.main.shutdown-timeout=40
camel.main.use-mdc-logging=false
# No payload logging; record contents may include confidential database fields.
streamforge.kafka.bootstrap=${KAFKA_BOOTSTRAP}
streamforge.kafka.topic=${KAFKA_TOPIC}
streamforge.kafka.username=${KAFKA_USERNAME}
streamforge.kafka.password=${KAFKA_PASSWORD}
streamforge.kafka.ca=/mnt/trust/kafka-ca.crt
streamforge.s3.endpoint=${S3_ENDPOINT}
streamforge.s3.region=${S3_REGION}
streamforge.s3.bucket=${S3_BUCKET}
streamforge.s3.prefix=${S3_PREFIX:camel/}
streamforge.s3.path-style=${S3_PATH_STYLE:true}
streamforge.s3.ca=/mnt/trust/s3-ca.crt
