{{- $items := list
  (dict "name" "source-auth" "path" "kafka/source" "keys" (dict "password" "KAFKA_SOURCE_PASSWORD"))
  (dict "name" "postgres-credentials" "path" "postgres" "postgres" true "keys" (dict "username" "PG_CDC_USERNAME" "password" "PG_CDC_PASSWORD" "ca.crt" "PG_CA_PEM" "database" "PG_DATABASE" "host" "PG_HOST" "port" "PG_PORT"))
  (dict "name" "external-trust" "path" "trust" "keys" (dict "kafka-ca.crt" "KAFKA_CA_PEM"))
}}
{{- $s3keys := dict "bucket" "S3_BUCKET" "endpoint" "S3_ENDPOINT" "region" "S3_REGION" "path-style" "S3_PATH_STYLE" "ca.crt" "S3_CA_CERTIFICATE_PEM" }}
{{- if has .Values.mode (list "aiven" "both" "all") }}
{{- $items = append $items (dict "name" "aiven-auth" "path" "kafka/aiven" "keys" (dict "password" "KAFKA_AIVEN_PASSWORD")) }}
{{- $items = append $items (dict "name" "s3-aiven" "path" "s3/aiven" "s3" true "aiven" true "keys" (merge (dict "access-key-id" "S3_AIVEN_ACCESS_KEY_ID" "secret-access-key" "S3_AIVEN_SECRET_ACCESS_KEY") (deepCopy $s3keys))) }}
{{- end }}
{{- if has .Values.mode (list "camel" "both" "all") }}
{{- $items = append $items (dict "name" "camel-auth" "path" "kafka/camel" "keys" (dict "password" "KAFKA_CAMEL_QUARKUS_PASSWORD")) }}
{{- $items = append $items (dict "name" "s3-camel" "path" "s3/camel" "s3" true "keys" (merge (dict "access-key-id" "S3_CAMEL_QUARKUS_ACCESS_KEY_ID" "secret-access-key" "S3_CAMEL_QUARKUS_SECRET_ACCESS_KEY") (deepCopy $s3keys))) }}
{{- end }}
{{- if has .Values.mode (list "camel-connect" "all") }}
{{- $items = append $items (dict "name" "camel-connect-auth" "path" "kafka/camel-connect" "keys" (dict "password" "KAFKA_CAMEL_CONNECT_PASSWORD")) }}
{{- $items = append $items (dict "name" "s3-camel-connect" "path" "s3/camel-connect" "s3" true "keys" (merge (dict "access-key-id" "S3_CAMEL_CONNECT_ACCESS_KEY_ID" "secret-access-key" "S3_CAMEL_CONNECT_SECRET_ACCESS_KEY") (deepCopy $s3keys))) }}
{{- end }}
{{- range $items }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ $.Values.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if .postgres }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # NetworkPolicy cannot resolve Secret values. Fail reconciliation if
        # the runtime port differs from the separately reviewed egress port.
        port: {{ printf "{{ if ne .port %q }}{{ .ERROR_PG_PORT_MUST_MATCH_NETWORK_POSTGRES_PORT }}{{ end }}{{ .port }}" (toString $.Values.network.postgresPort) | quote }}
        host: {{ `{{ if eq .host "" }}{{ .ERROR_PG_HOST_REQUIRED }}{{ end }}{{ .host }}` | quote }}
        database: {{ `{{ if eq .database "" }}{{ .ERROR_PG_DATABASE_REQUIRED }}{{ end }}{{ .database }}` | quote }}
        username: {{ `{{ if eq .username "" }}{{ .ERROR_PG_CDC_USERNAME_REQUIRED }}{{ end }}{{ .username }}` | quote }}
    {{- end }}
    {{- if .s3 }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # ESO v2 rejects missing template keys. The ERROR_* keys below are
        # deliberately never fetched: invalid configuration fails reconciliation
        # without including any provider values in the validation error.
        endpoint: {{ `{{ if not (regexMatch "^https://[^/@?#[:space:]]+$" .endpoint) }}{{ .ERROR_S3_ENDPOINT_REQUIRE_HTTPS_WITHOUT_USERINFO }}{{ end }}{{ .endpoint }}` | quote }}
        bucket: {{ `{{ if not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" .bucket) }}{{ .ERROR_S3_BUCKET_INVALID }}{{ end }}{{ .bucket }}` | quote }}
        region: {{ `{{ if eq .region "" }}{{ .ERROR_S3_REGION_REQUIRED }}{{ end }}{{ .region }}` | quote }}
        {{- if .aiven }}
        path-style: {{ `{{ if ne (index . "path-style") "true" }}{{ .ERROR_AIVEN_REQUIRES_S3_PATH_STYLE_TRUE }}{{ end }}true` | quote }}
        {{- else }}
        path-style: {{ `{{ if not (or (eq (index . "path-style") "true") (eq (index . "path-style") "false")) }}{{ .ERROR_S3_PATH_STYLE_REQUIRE_TRUE_OR_FALSE }}{{ end }}{{ index . "path-style" }}` | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- $path := .path }}
    {{- range $key, $property := .keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.vaultPrefix }}/{{ $path }}
        property: {{ $property | quote }}
    {{- end }}
---
{{- end }}
