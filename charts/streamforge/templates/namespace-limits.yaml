apiVersion: v1
kind: ResourceQuota
metadata:
  name: streamforge
spec:
  hard:
    requests.cpu: "14"
    requests.memory: 28Gi
    limits.cpu: "40"
    limits.memory: 48Gi
    requests.storage: 800Gi
    persistentvolumeclaims: "8"
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: streamforge
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 512Mi}
