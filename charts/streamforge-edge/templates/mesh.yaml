{{- $principal := printf "%s/ns/%s/sa/%s-istio" .Values.mesh.trustDomain .Release.Namespace .Values.gatewayName }}
{{- range $item := list (dict "name" .Values.dashboardWaypoint "ns" .Release.Namespace) (dict "name" .Values.identityWaypoint "ns" .Values.identityNamespace) }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $item.name }}-options, namespace: {{ $item.ns }}}
data:
  deployment: |
    spec:
      replicas: 1
      template:
        metadata:
          annotations:
            descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml $.Values.proxyResources | nindent 16 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.ns }}
  labels: {istio.io/waypoint-for: all}
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: {{ $item.name }}-options}
  listeners: [{name: mesh, port: 15008, protocol: HBONE}]
---
{{- end }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: dashboard-gateway-at-waypoint}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: {{ .Values.dashboardWaypoint }}}]
  action: ALLOW
  rules:
    - from: [{source: {principals: [{{ $principal | quote }}]}}]
      to:
        - operation:
            ports: ["8080"]
            methods: [GET, POST, PATCH]
            paths: ["/", "/index.html", "/app.js", "/app.css", "/vendor/keycloak.js", "/auth/config", "/api/orders", "/api/orders/*"]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: identity-strict, namespace: {{ .Values.identityNamespace }}}
spec:
  selector: {matchLabels: {app: keycloak}}
  mtls: {mode: STRICT}
  portLevelMtls:
    "9000": {mode: DISABLE}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: identity-default-deny, namespace: {{ .Values.identityNamespace }}}
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: keycloak-transport, namespace: {{ .Values.identityNamespace }}}
spec:
  selector: {matchLabels: {app: keycloak}}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "%s/ns/%s/sa/%s" .Values.mesh.trustDomain .Values.identityNamespace .Values.identityWaypoint | quote }}
              # Authorino uses a sidecar, which does not traverse destination waypoints.
              - {{ printf "%s/ns/%s/sa/%s" .Values.mesh.trustDomain .Values.mesh.authorinoNamespace .Values.mesh.authorinoServiceAccount | quote }}
      to: [{operation: {ports: ["8080"]}}]
    - to: [{operation: {ports: ["9000"]}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: keycloak-access-at-waypoint, namespace: {{ .Values.identityNamespace }}}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: {{ .Values.identityWaypoint }}}]
  action: ALLOW
  rules:
    - from: [{source: {principals: [{{ $principal | quote }}]}}]
      to: [{operation: {ports: ["8080"]}}]
    - from:
        - source:
            principals: [{{ printf "%s/ns/%s/sa/order-dashboard" .Values.mesh.trustDomain .Release.Namespace | quote }}]
      to:
        - operation:
            ports: ["8080"]
            methods: [GET]
            paths: ["/realms/{{ .Values.realm }}/protocol/openid-connect/certs"]
