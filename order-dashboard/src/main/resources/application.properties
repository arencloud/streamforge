quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=8K
quarkus.http.access-log.enabled=false
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Content-Security-Policy".value=${DASHBOARD_CSP:default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'}
quarkus.http.header."Cache-Control".value=no-store
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${PG_APP_USERNAME:}
quarkus.datasource.password=${PG_APP_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:streamforge}
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=verify-full
quarkus.datasource.jdbc.additional-jdbc-properties.sslrootcert=${PG_CA_FILE:/mnt/postgres-ca/ca.crt}
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=5S
streamforge.preview=false
streamforge.s3.root=${S3_CONFIG_ROOT:/mnt/s3-readers}
streamforge.s3.topic=${KAFKA_TOPIC:sf.public.orders}
streamforge.s3.scan-interval=15s
%preview.streamforge.preview=true
%preview.quarkus.datasource.active=false

# Public exposure enables bearer authentication and role checks in addition to RHCL.
streamforge.auth.enabled=${DASHBOARD_AUTH_ENABLED:false}
streamforge.auth.url=${OIDC_PUBLIC_URL:https://auth.example.invalid}
streamforge.auth.realm=${OIDC_REALM:streamforge}
streamforge.auth.client-id=${OIDC_CLIENT_ID:streamforge-dashboard}
quarkus.oidc.tenant-enabled=${DASHBOARD_AUTH_ENABLED:false}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_PUBLIC_URL:https://auth.example.invalid}/realms/${OIDC_REALM:streamforge}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=${OIDC_JWKS_URL:http://keycloak-service.streamforge-identity.svc.cluster.local:8080/realms/streamforge/protocol/openid-connect/certs}
quarkus.oidc.token.issuer=${OIDC_PUBLIC_URL:https://auth.example.invalid}/realms/${OIDC_REALM:streamforge}
quarkus.oidc.token.audience=${OIDC_CLIENT_ID:streamforge-dashboard}
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
